 <pattern id="plateSheen" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 2h9M2 0v9" stroke="#aab3bf" opacity=".12" stroke-width=".6"/></pattern>
</defs>
<g stroke="#2e2b25" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
