 <g fill="#b8864e" stroke="#6f4526" stroke-width="1.1">
  <circle cx="230" cy="140" r="2.6"/><circle cx="278" cy="146" r="2.6"/><circle cx="230" cy="358" r="2.6"/><circle cx="279" cy="354" r="2.6"/><circle cx="255" cy="136" r="2.4"/><circle cx="255" cy="364" r="2.4"/>
 </g>
