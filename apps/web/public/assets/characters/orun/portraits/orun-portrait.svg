 <path d="M146 116L158 114" fill="none" stroke="#7c4c36" stroke-width="2.6"/>
</g>
<!-- Ambient: forged sparks settle around the wall. -->
<g stroke="none"><circle cx="52" cy="330" r="2.4" fill="#d29a5c" opacity=".8"/><circle cx="196" cy="356" r="1.8" fill="#8a93a0" opacity=".8"/><circle cx="64" cy="288" r="1.4" fill="#a5703c" opacity=".7"/><circle cx="206" cy="96" r="1.6" fill="#d29a5c" opacity=".55"/></g>
