<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" data-anchor="150,400" data-asset="portrait">
<title>Orun — Iron Sentinel, illustrated vector study</title>
<defs>
 <linearGradient id="plate" x2=".35" y2="1"><stop stop-color="#79808d"/><stop offset=".55" stop-color="#565d69"/><stop offset="1" stop-color="#3a3f49"/></linearGradient>
 <linearGradient id="plateDark" x2=".6" y2="1"><stop stop-color="#616874"/><stop offset=".6" stop-color="#41464f"/><stop offset="1" stop-color="#2e323a"/></linearGradient>
 <linearGradient id="copper" x2="1" y2=".35"><stop stop-color="#d29a5c"/><stop offset=".55" stop-color="#a5703c"/><stop offset="1" stop-color="#6f4526"/></linearGradient>
 <linearGradient id="skin" x2=".8" y2=".7"><stop stop-color="#dfb087"/><stop offset=".6" stop-color="#c08a63"/><stop offset="1" stop-color="#8e6045"/></linearGradient>
